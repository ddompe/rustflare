[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
rustflare-core = { path = "crates/core" }
rustflare-camera = { path = "crates/camera" }
rustflare-mount = { path = "crates/mount" }
rustflare-tracking = { path = "crates/tracking" }
rustflare-capture = { path = "crates/capture" }
rustflare-stack = { path = "crates/stack" }

[profile.release]
opt-level = 3
lto = "thin"
