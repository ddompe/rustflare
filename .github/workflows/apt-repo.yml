name: Site (user manual and apt repository)

# Builds a signed apt repository from every released .deb and publishes it with GitHub Pages
# (https://<owner>.github.io/<repo>/). Runs after each Release and can be started by hand.
# One-time setup: docs/project/apt-repository.md (signing key as repository secrets, Pages source = GitHub Actions).
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/apt-repo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the user manual
        run: |
          pip install mkdocs
          mkdocs build -d site/manual
      - name: Signing key present?
        run: |
          [ -n "${{ secrets.APT_GPG_PRIVATE_KEY }}" ] || { echo "::error::secret APT_GPG_PRIVATE_KEY is not set: see docs/project/apt-repository.md"; exit 1; }
      - name: Import signing key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"
      - name: Collect released packages
        run: |
          mkdir -p site/pool/main
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern 'rustflare_*_arm64.deb' --dir site/pool/main || true
          done
          ls -la site/pool/main
      - name: Build and sign the repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils
          cd site
          D=dists/stable/main/binary-arm64
          mkdir -p "$D"
          apt-ftparchive packages pool > "$D/Packages"
          gzip -9kf "$D/Packages"
          apt-ftparchive -o APT::FTPArchive::Release::Origin=RustFlare -o APT::FTPArchive::Release::Label=RustFlare \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=arm64 -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          GPG="gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -u $KEYID"
          printf '%s' "$GPG_PASSPHRASE" | $GPG --clearsign -o dists/stable/InRelease dists/stable/Release
          printf '%s' "$GPG_PASSPHRASE" | $GPG --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --export "$KEYID" > rustflare.gpg
          gpg --armor --export "$KEYID" > rustflare.asc
          cat > index.html <<'HTML'
          <!doctype html><title>RustFlare apt repository</title>
          <h1>RustFlare</h1>
          <p><a href="manual/">User manual</a></p>
          <h2>apt repository</h2>
          <pre>curl -fsSL https://ddompe.github.io/rustflare/rustflare.gpg | sudo tee /usr/share/keyrings/rustflare.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/rustflare.gpg arch=arm64] https://ddompe.github.io/rustflare stable main" | sudo tee /etc/apt/sources.list.d/rustflare.list
          sudo apt update &amp;&amp; sudo apt install rustflare</pre>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
