name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (unit + web + simulator smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Unit tests
        run: cargo test --workspace
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: End-to-end smoke test on the simulators
        run: |
          cargo build --release -p rustflare-server
          scripts/smoke.sh ./target/release/rustflare-server ./data-smoke | tee smoke.log
          grep -q "capture=idle/saved" smoke.log

  package-arm64:
    name: Build Raspberry Pi package (arm64 .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb
      - name: libclang (bindgen for the Player One SDK)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build package
        run: scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rustflare-arm64-deb
          path: dist/
