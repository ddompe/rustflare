[package]
name = "rustflare-camera"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Player One cameras via the vendor SDK (bundled .so for linux x64/arm64, macOS dylib).
# Needs libclang at build time (bindgen).
playerone = ["dep:playerone-sdk"]

# ZWO ASI cameras: the vendor library (libASICamera2, Debian package libasi) is dlopen-ed at run time.
asi = ["dep:libloading", "dep:log"]

[dependencies]
rustflare-core.workspace = true
libloading = { version = "0.8", optional = true }
log = { workspace = true, optional = true }
playerone-sdk = { version = "0.2.3", optional = true }
