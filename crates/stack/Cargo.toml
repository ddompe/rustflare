[package]
name = "rustflare-stack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lucky-imaging stacker for RustFlare recordings: rank frames, align, stack, write FITS"

[lib]
name = "rustflare_stack"

[[bin]]
name = "rustflare-stack"
path = "src/main.rs"

[dependencies]
rustfft = "6"
realfft = "3"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
rustflare-core.workspace = true
rustflare-capture.workspace = true
